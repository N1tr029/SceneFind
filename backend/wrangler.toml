name = "scenefind-backend"
main = "src/index.ts"
compatibility_date = "2026-08-19"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# Provider keys are SECRETS, never committed. Set them with:
#   wrangler secret put GROQ_API_KEY
#   wrangler secret put GEMINI_API_KEY
#   wrangler secret put SEARCH_API_KEY   # SerpApi (64 hex) or Brave (BSA...)
# (Optional, for App Attest / DeviceCheck once wired:)
#   wrangler secret put APPLE_TEAM_ID
#   wrangler secret put APP_ATTEST_ROOT_CA        # or use the bundled Apple root
# ---------------------------------------------------------------------------

# Per-analysis state + SSE fan-out lives in a Durable Object.
[[durable_objects.bindings]]
name = "ANALYSIS"
class_name = "AnalysisSession"

[[durable_objects.bindings]]
name = "APP_ATTEST"
class_name = "AppAttestationRegistry"

[[durable_objects.bindings]]
name = "ENTITLEMENTS"
class_name = "EntitlementLedger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AnalysisSession", "AppAttestationRegistry", "EntitlementLedger"]

# Entitlement owner mappings (install -> purchase owner). The binding name is
# historical: rate limiting moved to the [[ratelimits]] bindings below.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "d735950d74b54e8d988927a667834a5d"   # wrangler kv:namespace create RATE_LIMIT

# Episode -> provider URL cache. Shared by every install, which is the whole
# point: a search costs quota, an episode's page URL never changes, so the first
# device to ask pays and everyone after is free. Spend then scales with distinct
# episodes rather than with users.
[[kv_namespaces]]
binding = "WATCH_LINKS"
id = "7f8a495fb7944fb7b29dc6447bfe79c0"   # wrangler kv:namespace create WATCH_LINKS

# Downloaded subtitle tracks, keyed by title. OpenSubtitles meters downloads,
# not searches, so a track is fetched once and then reused by every clip from
# that title — and titles it does not carry are remembered too, to keep repeat
# shares of an unindexed clip from spending the daily quota on nothing.
[[kv_namespaces]]
binding = "SUBTITLES"
id = "5eeeb2cad31f4cd4b2dca90d784e0ac0"   # wrangler kv namespace create SUBTITLES

# Abuse limits. Counters live at the edge rather than in KV, so they cost no KV
# writes (Workers Free allows 1,000 a day, and every put throws past that).
# Periods can only be 10 or 60 seconds. namespace_id is account-wide: another
# Worker using the same id would share these counters.
[[ratelimits]]
name = "INSTALL_RATE_LIMITER"
namespace_id = "72001"

  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "IP_RATE_LIMITER"
namespace_id = "72002"

  [ratelimits.simple]
  limit = 120
  period = 60

[[ratelimits]]
name = "CHALLENGE_RATE_LIMITER"
namespace_id = "72003"

  [ratelimits.simple]
  limit = 60
  period = 60

# Persisted Worker logs (Workers Free includes 200,000 events a day). Without
# this, provider failures such as an expired key were invisible: calls were
# caught, degraded to "unverified", and left no trace.
[observability]
enabled = true

[vars]
# Non-secret config. Model names can be overridden per environment.
# 3.5-flash answered the same prompt in ~9.3s where 3.6-flash took ~1.7s.
GEMINI_MODEL = "gemini-3.6-flash"
GEMINI_FALLBACK_MODEL = "gemini-3.1-flash-lite"
# llama-3.3-70b-versatile was shut down on 2026-08-16; this is Groq's named
# replacement. It is a reasoning model with strict JSON-schema support.
GROQ_MODEL = "openai/gpt-oss-120b"
GROQ_TRANSCRIPTION_MODEL = "whisper-large-v3-turbo"
# Set to "1" to allow unauthenticated calls during local development only.
ALLOW_INSECURE_DEV_AUTH = "0"
APP_ATTEST_ALLOW_DEVELOPMENT = "0"
APPLE_ENABLE_ONLINE_CHECKS = "1"
APPLE_BUNDLE_ID = "com.kavigandham.scenefind"
